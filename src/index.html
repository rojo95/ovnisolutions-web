    <!-- Pantalla de carga (estilo LoftLoader): CSS inline para que se aplique
         desde el primer render y tape la web mientras cargan los recursos.
         No afecta al SEO: el contenido prerenderizado está debajo intacto. -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0c0c;
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .app-loader__spinner {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-loader__spinner::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #b700ff;
        border-right-color: #00bbff;
        animation: app-loader-spin 1.1s linear infinite;
      }
      .app-loader__spinner img {
        width: 120px;
        height: 120px;
        animation: app-loader-pulse 1.6s ease-in-out infinite;
        filter: drop-shadow(0 0 16px rgba(183, 0, 255, 0.6));
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes app-loader-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.06);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader__spinner::before,
        .app-loader__spinner img {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="mat-typography">
    <app-root></app-root>

    <!-- Pantalla de carga (estilo LoftLoader): tapa la pantalla mientras
         carga la web. Se oculta al dispararse window.load (o a los 5s como
         respaldo). aria-hidden: contenido no indexable para los buscadores. -->
    <div id="app-loader" aria-hidden="true">
      <div class="app-loader__spinner">
        <img
          src="assets/image/favicon.svg"
          alt=""
          width="120"
          height="120"
        />
      </div>
    </div>

    <script>
      (function () {
        var loader = document.getElementById('app-loader');
        var hide = function () {
          if (loader && !loader.classList.contains('hidden')) {
            loader.classList.add('hidden');
          }
        };
        if (document.readyState === 'complete') {
          hide();
        } else {
          window.addEventListener('load', hide);
          // Respaldo: nunca dejar el loader bloqueando la pantalla
          setTimeout(hide, 5000);
        }
      })();
    </script>
  </body>
